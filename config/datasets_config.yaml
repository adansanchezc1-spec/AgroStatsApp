    target_table: "fact_sipsa_abastecimiento"
    
  sipsa_precios:
    resource_id: "gwbi-fnzs"
    format: "api"
    raw_path: "data/raw/sipsa_precios.csv"
    processed_path: "data/processed/sipsa_precios.parquet"
    target_table: "fact_sipsa_precios"
    
  sipsa_insumos:
    resource_id: "sipsa_insumos"
    format: "tabular"
    raw_path: "data/raw/sipsa_insumos.csv"
    processed_path: "data/processed/sipsa_insumos.parquet"
    target_table: "fact_sipsa_insumos"

  dane_ipc_ipp:
    format: "tabular"
    raw_path: "data/raw/dane_ipc.csv"
    processed_path: "data/processed/dane_ipc_ipp.parquet"
