# Datasets Configuration - AgroStats Intelligence Platform
# Fase PDCO: PLAN -> DEVELOPMENT

project_name: AgroStatsApp
version: 1.0.0

datasets:
  sipsa_abastecimientos:
    resource_id: "sipsa_abastecimiento"
    format: "tabular"
    raw_path: "data/raw/sipsa_abastecimientos.csv"
